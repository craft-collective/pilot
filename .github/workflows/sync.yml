name: sync

# Syncs are on demand: a member comments `/sync <fork>` on any issue (the commands workflow),
# or runs this by hand. Whoever starts it is credited with the sync.
on:
  workflow_dispatch:
    inputs:
      fork:
        description: Fork id
        required: true

concurrency:
  group: pilot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync
        env:
          PILOT_APP_KEY: ${{ secrets.PILOT_APP_KEY }}
          FORK: ${{ inputs.fork }}
          LOGIN: ${{ github.actor }}
        run: |
          python3 scripts/pilot.py sync "$FORK" --user "$LOGIN"
