name: reviewers

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assign reviewers to new patch PRs
        env:
          PILOT_APP_KEY: ${{ secrets.PILOT_APP_KEY }}
        run: python3 scripts/pilot.py assign
