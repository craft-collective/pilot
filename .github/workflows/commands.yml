name: commands

# `/sync <fork>` on any issue, and `/ready` or `/promote` on a sync issue. Who may run them is
# checked against the forks on the default branch, never against anything in the comment.
on:
  issue_comment:
    types: [created]

concurrency:
  group: pilot-sync
  cancel-in-progress: false

jobs:
  command:
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/sync') ||
       (contains(github.event.issue.labels.*.name, 'sync') &&
        (startsWith(github.event.comment.body, '/ready') || startsWith(github.event.comment.body, '/promote'))))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the command
        env:
          PILOT_APP_KEY: ${{ secrets.PILOT_APP_KEY }}
          ISSUE: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          python3 scripts/pilot.py command --issue "$ISSUE" --user "$LOGIN" --body "$BODY"
